<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background circle with glow -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" filter="url(#glow)" />
  <!-- Smiling Face Details -->
  <circle cx="180" cy="210" r="24" fill="#ffffff" />
  <circle cx="332" cy="210" r="24" fill="#ffffff" />
  <!-- Glowing cheeks -->
  <circle cx="130" cy="270" r="20" fill="#f472b6" opacity="0.4" filter="blur(5px)" />
  <circle cx="382" cy="270" r="20" fill="#f472b6" opacity="0.4" filter="blur(5px)" />
  <!-- Smile path -->
  <path d="M 160 300 Q 256 380 352 300" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
</svg>
